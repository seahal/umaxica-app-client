name: Cross-Platform Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: umaxica-apps-cli

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (musl - static binary)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: umaxica-apps-cli
            asset_name: umaxica-apps-cli-linux-x86_64
            cross: true

          # Linux aarch64 (musl - static binary)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact_name: umaxica-apps-cli
            asset_name: umaxica-apps-cli-linux-aarch64
            cross: true

          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: umaxica-apps-cli
            asset_name: umaxica-apps-cli-macos-aarch64
            cross: false

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: umaxica-apps-cli.exe
            asset_name: umaxica-apps-cli-windows-x86_64.exe
            cross: false

          # Windows aarch64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact_name: umaxica-apps-cli.exe
            asset_name: umaxica-apps-cli-windows-aarch64.exe
            cross: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # cross を使う Linux ターゲット
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build with cross
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      # ネイティブビルド
      - name: Build native
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }}

      # テスト（クロスコンパイルでない場合のみ）
      - name: Run tests
        if: "!matrix.cross && matrix.target != 'aarch64-pc-windows-msvc'"
        run: cargo test --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  build-summary:
    name: Build Summary
    needs: [build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Display summary
        run: |
          echo "# Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Supported Platforms" >> $GITHUB_STEP_SUMMARY
          echo "- Linux x86_64 (musl, static)" >> $GITHUB_STEP_SUMMARY
          echo "- Linux aarch64 (musl, static)" >> $GITHUB_STEP_SUMMARY
          echo "- macOS aarch64 (Apple Silicon)" >> $GITHUB_STEP_SUMMARY
          echo "- Windows x86_64" >> $GITHUB_STEP_SUMMARY
          echo "- Windows aarch64" >> $GITHUB_STEP_SUMMARY
